<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Collections — ALEGRIA Paris</title>
    <link rel="stylesheet" href="../style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <!-- Header (copié depuis index) -->
    <header class="header">
        <nav class="navbar">
                <div class="navbar__logo">
                <a href="../index.html"><img src="../assets/images/LOGO/Logo blanc sur fond transparent.png" alt="ALEGRIA Paris" class="logo"></a>
            </div>
            <button class="navbar__toggle" aria-label="Menu mobile"><span></span><span></span><span></span></button>
            <ul class="navbar__menu">
                <li><a href="../index.html#accueil">Accueil</a></li>
                <li><a href="../index.html#collections">Bijoux</a></li>
                <li><a href="../index.html#univers">L'univers</a></li>
                <li><a href="../index.html#contact">Contact</a></li>
            </ul>
            <div class="navbar__actions"><a href="#" class="btn-icon" aria-label="Recherche"></a></div>
        </nav>
    </header>

    <main class="page-collections">
        <section class="container collections-listing">
            <div class="collections-top">
                <p class="section-subtitle">Découvrez nos créations — filtrez par collection</p>
                <div class="collections-toolbar">
                    <div class="collections-filters">
                        <div class="dropdown filter-dropdown relative" data-filter-group="types">
                            <button class="dropdown__toggle px-6 py-3 rounded-full border-2 border-white/20 text-white bg-transparent ring-2 ring-indigo-400/40 hover:shadow-lg hover:ring-indigo-400/60 focus:outline-none focus:ring-4 focus:ring-indigo-300/30 transition-shadow duration-150">Types</button>
                            <div class="dropdown__menu hidden absolute z-50 bg-white rounded-lg shadow-lg mt-4 w-56" data-dropdown="types">
                                <button class="filter-option w-full text-left px-4 py-2 hover:bg-gray-100" data-filter-type="bague">Bagues</button>
                                <button class="filter-option w-full text-left px-4 py-2 hover:bg-gray-100" data-filter-type="collier">Colliers</button>
                                <button class="filter-option w-full text-left px-4 py-2 hover:bg-gray-100" data-filter-type="bracelet">Bracelets</button>
                                <button class="filter-option w-full text-left px-4 py-2 hover:bg-gray-100" data-filter-type="boucles-oreilles">Boucles d'oreilles</button>
                            </div>
                        </div>

                        <div class="dropdown filter-dropdown relative" data-filter-group="collections">
                            <button class="dropdown__toggle px-6 py-3 rounded-full border-2 border-white/20 text-white bg-transparent ring-2 ring-indigo-400/40 hover:shadow-lg hover:ring-indigo-400/60 focus:outline-none focus:ring-4 focus:ring-indigo-300/30 transition-shadow duration-150">Collections</button>
                            <div class="dropdown__menu hidden absolute z-50 bg-white rounded-lg shadow-lg mt-4 w-56" data-dropdown="collections">
                                <button class="filter-option w-full text-left px-4 py-2 hover:bg-gray-100" data-filter-collection="etoiles-eternelles">Étoiles Éternelles</button>
                                <button class="filter-option w-full text-left px-4 py-2 hover:bg-gray-100" data-filter-collection="galaxie">Galaxie</button>
                                <button class="filter-option w-full text-left px-4 py-2 hover:bg-gray-100" data-filter-collection="constellation">Constellation</button>
                                <button class="filter-option w-full text-left px-4 py-2 hover:bg-gray-100" data-filter-collection="toutes">Toutes</button>
                            </div>
                        </div>

                        <div id="selectedFilters" class="selected-filters flex gap-2 flex-wrap ml-4" aria-live="polite"></div>
                    </div>

                    <div class="collections-controls">
                        <div class="dropdown sort-dropdown relative">
                            <button id="sortToggle" class="dropdown__toggle px-6 py-3 rounded-full border-2 border-white/20 text-white bg-transparent ring-2 ring-indigo-400/40 hover:shadow-lg hover:ring-indigo-400/60 focus:outline-none focus:ring-4 focus:ring-indigo-300/30 transition-shadow duration-150">Trier</button>
                            <div class="dropdown__menu hidden absolute z-50 bg-white rounded-lg shadow-lg mt-4 w-56" data-dropdown="sort">
                                <button class="sort-option w-full text-left px-4 py-2 hover:bg-gray-100" data-sort="default">Pertinence</button>
                                <button class="sort-option w-full text-left px-4 py-2 hover:bg-gray-100" data-sort="price-asc">Prix croissant</button>
                                <button class="sort-option w-full text-left px-4 py-2 hover:bg-gray-100" data-sort="price-desc">Prix décroissant</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="collectionsGrid" class="collections__grid"></div>

            <div class="collections-loadmore" style="text-align:center;margin-top:1.5rem;">
                <button id="loadMoreBtn" class="btn btn--primary">Charger plus</button>
            </div>
        </section>
    </main>

    <!-- Footer (copied minimal) -->
    <footer class="footer">
        <div class="container">
            <div class="footer__bottom">
                <p>&copy; 2024 ALEGRIA Paris. Tous droits réservés.</p>
            </div>
        </div>
    </footer>

    <script src="../script.js"></script>
        <script src="../scripts/collection.js"></script>
</body>
</html>
